name: App Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: app-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-docs-only.yml
    permissions:
      issues: read
      pull-requests: read

  app-test:
    needs: changes
    # ステータスチェック関数を含まない if には success() が暗黙適用され、changes 失敗時にスキップされてしまう。
    # !cancelled() でそれを外し fail open にする(失敗時 outputs.code は空文字 → != 'false' が真。キャンセル時は走らない)。
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      # Gradle User Home のキャッシュ復元(PR では read-only、書き込みは main の CD 実行時のみ)。
      # v6 は構成キャッシュ未対応のため cache-encryption-key は将来の対応復活時に有効になる。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # :app:core:domain:wasmJsBrowserTest がコンパイルとブラウザ実行(Karma)を兼ねる
      # (クライアント側でユニットテストが存在するのは現時点で :app:core:domain のみ。feature のテストが増えたら対象を広げる)
      - name: Run app unit tests
        run: ./gradlew :app:core:domain:wasmJsBrowserTest
