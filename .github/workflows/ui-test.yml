name: UI Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ui-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-docs-only.yml
    permissions:
      issues: read
      pull-requests: read

  ui-test:
    needs: changes
    # ステータスチェック関数を含まない if には success() が暗黙適用され、changes 失敗時にスキップされてしまう。
    # !cancelled() でそれを外し fail open にする(失敗時 outputs.code は空文字 → != 'false' が真。キャンセル時は走らない)。
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      # Gradle User Home のキャッシュ復元(PR では read-only、書き込みは main の CD 実行時のみ)。
      # v6 は構成キャッシュ未対応のため cache-encryption-key は将来の対応復活時に有効になる。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build production distribution
        run: ./gradlew :app:webApp:wasmJsBrowserDistribution

      # Playwright のバージョン更新時にキャッシュを更新するため、キーはバージョンカタログに追従させる。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # ubuntu-latest は Chrome 同梱でシステムライブラリが揃っているため install-deps は不要
      - name: Install Playwright Chromium
        run: ./gradlew :test:e2e:installPlaywright

      # 静的サーバーをバックグラウンドで起動し、curl のリトライで準備完了を待つ。
      # ログはファイルへ逃がす(ステップ終了後の出力ストリームへの書き込み失敗を避け、失敗時の調査にも使える)。
      - name: Serve distribution
        run: |
          python3 -m http.server 8083 --directory app/webApp/build/dist/wasmJs/productionExecutable > server.log 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused -sSf http://localhost:8083 > /dev/null

      - name: Run E2E tests
        run: ./gradlew :test:e2e:test -PbaseUrl=http://localhost:8083
